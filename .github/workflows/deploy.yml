name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master
  workflow_dispatch:

# Required permissions for GitHub's native deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create files with cat EOF
        run: |
          # Create api directory
          mkdir -p api

          # Create valid api/get-ram.json
          cat << 'EOF' > api/get-ram.json
          [
            {
              "ram_mb": 1024,
              "status": "active"
            },
            {
              "ram_mb": 2048,
              "status": "pending"
            }
          ]
          EOF

          # Create index.html with a fetch script
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>RAM Status Fetcher</title>
              <style>
                  body { font-family: sans-serif; margin: 40px; background: #f9f9f9; color: #333; }
                  pre { background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 6px; }
              </style>
          </head>
          <body>
              <h1>RAM Status API</h1>
              <pre id="output">Loading RAM data...</pre>
              <script>
                  fetch('api/get-ram.json')
                      .then(response => response.json())
                      .then(data => {
                          document.getElementById('output').textContent = JSON.stringify(data, null, 2);
                      })
                      .catch(error => {
                          document.getElementById('output').textContent = 'Error: ' + error.message;
                      });
              </script>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
