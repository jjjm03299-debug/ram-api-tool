name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:
    inputs:
      gh_token:
        description: 'Enter your GitHub token (PAT)'
        required: true
        type: secret

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create files with cat EOF
        run: |
          # Create api directory
          mkdir -p api

          # Create api/get-ram.json with the syntax error
          cat << 'EOF' > api/get-ram.json
          [
            {
              "ram_mb": 1024,
              "status": "active"
            
            {
              "ram_mb": 2048,
              "status": "pending"
            }
          ]
          EOF

          # Create index.html with a fetch script for the JSON file
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>RAM Status Fetcher</title>
          </head>
          <body>
              <h1>RAM Status</h1>
              <pre id="output">Loading RAM data...</pre>
              <script>
                  fetch('api/get-ram.json')
                      .then(response => response.json())
                      .then(data => {
                          document.getElementById('output').textContent = JSON.stringify(data, null, 2);
                      })
                      .catch(error => {
                          document.getElementById('output').textContent = 'Failed to parse JSON (Syntax Error expected): ' + error.message;
                      });
              </script>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ inputs.gh_token }}
          publish_dir: .
